<<!DOCTYPE html>
<html>
<head>
    <title>میری پہلی ویب سائٹ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;

        }
        h1 {
            color: #008cba;
        }
        p {
            font-size: 18px;
            color: #333;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>خوش آمدید! یہ میری ویب سائٹ ہے</h1>

    <!-- نیا بٹن -->
    <button class="btn" onclick="alert('خوش آمدید! آپ نے بٹن پر کلک کیا۔')">یہاں کلک کریں</button>

</body>
</html>
